<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chép câu trả lời của Gemini/ChatGPT (Markdown/LaTeX/Mermaid) dùng cho Word / Docs - Dương Tấn Chánh</title>

    <!-- Thư viện Marked (Xử lý Markdown) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" onerror="this.onerror=null;this.src='js/marked.min.js';"></script>

    <!-- Thư viện Highlight.js (Tô màu mã nguồn) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" onerror="this.onerror=null;this.src='js/highlight.min.js';"></script>

    <!-- Cấu hình MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: { '[+]': ['ams'] }
            },
            svg: {
                fontCache: 'none',
                scale: 1,
                minScale: 1
            },
            startup: { typeset: false }
        };
    </script>
    <!-- Thư viện MathJax (Xử lý Toán) -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" onerror="this.onerror=null;this.src='js/tex-svg.js';"></script>

    <!-- Thư viện Mermaid (Xử lý Sơ đồ) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js" onerror="this.onerror=null;this.src='js/mermaid.min.js';"></script>
    <script>
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: false,
                theme: 'neutral',
                securityLevel: 'loose',
                themeVariables: {
                    fontFamily: 'Consolas, monospace'
                }
            });
        }
    </script>

    <style>
        /* --- 1. RESET & BOX-SIZING --- */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* --- 2. CSS VARIABLES (BẢNG MÀU TẬP TRUNG) --- */
        :root {
            /* Giao diện chính */
            --primary-color: #009911;
            --primary-hover: #009911;

            /* Nút bấm (Nền #0077CC, Chữ & Icon màu Trắng #FFFFFF) */
            --btn-bg: #0077CC;
            --btn-text: #FFFFFF;
            --btn-border: #0077CC;
            --btn-hover-bg: #550BFF;

            /* Màu nền, Chữ & Khung hiển thị */
            --bg-color: #FFFFFF;
            --border-color: #A5A5A5;
            --text-color: #000000;
            --toolbar-bg: #FFFFFF;
            --toolbar-text: #1A1A1A;
            --divider-color: #A5A5A5;
            --link-color: #0077CC;
            --blockquote-border: #009911;
            --blockquote-bg: #F0F0F0;

            /* Bảng biểu */
            --table-border-color: #000000;
            --table-th-bg: #FFFFFF;

            /* Khối Code & Syntax Highlight đồng bộ */
            --code-color: #000000;
            --code-bg: #F0F0F0;
            --code-border: #A5A5A5;
            --syntax-keyword: #FF2040;
            --syntax-function: #550BFF;
            --syntax-string: #0077CC;
            --syntax-builtin: #FF7000;
            --syntax-comment: #969696;
            --syntax-tag: #009911;

            /* Màu trạng thái */
            --success-color: #009911;
            --danger-color: #FF2040;
            --warning-color: #FF7000;
        }

        /* --- 3. GENERAL LAYOUT & TYPOGRAPHY --- */
        body {
            margin: 0;
            padding: 0.5rem 0.5rem 5.0rem 0.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 1.0rem;
            font-weight: normal;
            line-height: 1.5;
            overflow-wrap: break-word;
            word-break: normal;
            hyphens: none;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            margin: 0;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 1.0rem 0 0.5rem 0;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 1.0rem 0 0.5rem 0;
        }

        h4 {
            font-size: 1.0rem;
            font-weight: bold;
            margin: 0.8rem 0 0.4rem 0;
        }

        /* --- 4. HEADER & AUTHOR --- */
        header {
            background-color: var(--primary-color);
            color: #FFFFFF;
            padding: 0.8rem 1.0rem;
            border-radius: 0.4rem;
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            border: 2px solid var(--primary-color);
        }

        header .author {
            font-size: 1.0rem;
            color: #FFFFFF;
            text-align: right;
        }

        /* --- 5. MAIN CONTENT LAYOUT --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: row;
            border: 2px solid var(--border-color);
            border-radius: 0.4rem;
            background-color: #FFFFFF;
            overflow: hidden;
        }

        .column {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--border-color);
            background-color: #FFFFFF;
        }

        .column:last-child {
            border-right: none;
        }

        /* --- 6. TOOLBAR --- */
        .toolbar {
            background-color: var(--toolbar-bg);
            padding: 0.5rem 1.0rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.0rem;
            font-weight: bold;
            color: var(--toolbar-text);
            flex-shrink: 0;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* --- 7. BUTTON STYLES --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid var(--btn-border);
            padding: 0.4rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            height: 2.6rem;
            line-height: 1;
        }

        .btn-icon-only {
            width: 2.6rem;
            height: 2.6rem;
            padding: 0;
            flex-shrink: 0;
        }

        .btn:hover {
            background-color: var(--btn-hover-bg);
            border-color: var(--btn-hover-bg);
            color: var(--btn-text);
        }

        .btn svg {
            width: 1.2rem;
            height: 1.2rem;
            flex-shrink: 0;
            color: var(--btn-text);
        }

        /* --- 8. MODAL DIALOG --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .modal-card {
            background: #FFFFFF;
            padding: 1.0rem;
            border-radius: 0.8rem;
            border: 2px solid var(--border-color);
            max-width: 25.0rem;
            width: 90%;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 3.2rem;
            font-size: 1.05rem;
            padding: 0 1.0rem;
            border-radius: 0.4rem;
            border: 2px solid var(--btn-border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
        }

        .modal-btn:hover {
            background-color: var(--btn-hover-bg);
            border-color: var(--btn-hover-bg);
        }

        .modal-btn svg {
            margin-right: 0.8rem;
            width: 1.3rem;
            height: 1.3rem;
            flex-shrink: 0;
            color: #FFFFFF;
        }

        /* --- 9. INPUT & OUTPUT AREA --- */
        #latex-input {
            flex: 1;
            width: 100%;
            padding: 1.0rem;
            border: none;
            resize: none;
            outline: none;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 1.0rem;
            line-height: 1.5;
            color: var(--text-color);
            background-color: #FFFFFF;
            transition: background-color 0.2s;
        }

        #latex-output {
            flex: 1;
            padding: 1.0rem 1.0rem 5.0rem 1.0rem;
            overflow-y: auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
            box-sizing: border-box;
            background-color: #FFFFFF;
        }

        #latex-output > :first-child {
            margin-top: 0;
        }

        /* --- 10. MARKDOWN STYLES --- */
        .markdown-body {
            font-size: 1.0rem;
            line-height: 1.6;
            color: var(--text-color);
        }

        .markdown-body h1,
        .markdown-body h2 {
            border-bottom: 2px solid var(--divider-color);
            padding-bottom: 0.3rem;
        }

        .markdown-body p {
            margin-top: 0;
            margin-bottom: 0.8rem;
        }

        .markdown-body a {
            color: var(--link-color);
            text-decoration: underline;
        }

        .markdown-body hr {
            border: none;
            border-top: 2px solid var(--divider-color);
            margin: 1.0rem 0;
        }

        /* KHUNG GHI CHÚ ĐÃ TINH GỌN ĐÁY ÔM SÁT GỌN GÀNG */
        .markdown-body blockquote {
            border-left: 4px solid var(--blockquote-border);
            background-color: var(--blockquote-bg);
            color: var(--text-color);
            padding: 0.5rem 1.0rem;
            margin: 0.8rem 0;
            border-radius: 0.2rem;
        }

        .markdown-body blockquote > :last-child {
            margin-bottom: 0;
        }

        .markdown-body blockquote ul,
        .markdown-body blockquote ol {
            margin-bottom: 0.3rem;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 2.0rem;
            margin-bottom: 1.0rem;
        }

        .markdown-body li {
            margin-bottom: 0.4rem;
        }

        /* --- 11. CODE & SYNTAX HIGHLIGHT --- */
        .markdown-body :not(pre) > code {
            background-color: var(--code-bg);
            color: var(--code-color);
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 1.0rem;
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        .markdown-body pre {
            background-color: var(--code-bg);
            padding: 1.0rem;
            border-radius: 0.4rem;
            border: 2px solid var(--code-border);
            overflow-x: auto;
            margin-bottom: 1.0rem;
        }

        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
            border: none;
            color: var(--code-color);
            font-family: "Consolas", "Monaco", "Courier New", monospace;
            font-size: 1.0rem;
            line-height: 1.5;
            white-space: pre;
        }

        .hljs {
            color: var(--text-color);
            background: transparent;
        }
        .hljs-doctag, .hljs-keyword, .hljs-meta .hljs-keyword, .hljs-template-tag, .hljs-template-variable, .hljs-type, .hljs-variable.language_ {
            color: var(--syntax-keyword); font-weight: bold;
        }
        .hljs-title, .hljs-title.class_, .hljs-title.class_.inherited__, .hljs-title.function_ {
            color: var(--syntax-function); font-weight: bold;
        }
        .hljs-attr, .hljs-attribute, .hljs-literal, .hljs-meta, .hljs-number, .hljs-operator, .hljs-variable, .hljs-selector-attr, .hljs-selector-id, .hljs-selector-class {
            color: var(--syntax-string);
        }
        .hljs-regexp, .hljs-string, .hljs-meta .hljs-string {
            color: var(--syntax-string);
        }
        .hljs-built_in, .hljs-symbol {
            color: var(--syntax-builtin);
        }
        .hljs-comment, .hljs-code, .hljs-formula {
            color: var(--syntax-comment);
            font-style: italic;
        }
        .hljs-name, .hljs-quote, .hljs-selector-tag, .hljs-selector-pseudo {
            color: var(--syntax-tag);
        }
        .hljs-subst {
            color: var(--text-color);
        }
        .hljs-section {
            color: var(--syntax-string); font-weight: bold;
        }
        .hljs-addition {
            color: var(--success-color); background-color: #f0fff4;
        }
        .hljs-deletion {
            color: var(--danger-color); background-color: #ffeef0;
        }

        /* --- 12. TABLES & ALIGNMENT (VIỀN 0.75pt, CĂN TỪ TRÊN XUỐNG DƯỚI) --- */
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 1.0rem;
            font-size: 1.0rem;
        }

        .markdown-body th,
        .markdown-body td {
            border: 0.75pt solid var(--table-border-color);
            padding: 0.5rem 0.8rem;
            vertical-align: top;
        }

        .markdown-body th {
            background-color: var(--table-th-bg);
            font-weight: bold;
        }

        .markdown-body th[align="left"], .markdown-body td[align="left"] {
            text-align: left;
        }
        .markdown-body th[align="center"], .markdown-body td[align="center"] {
            text-align: center;
        }
        .markdown-body th[align="right"], .markdown-body td[align="right"] {
            text-align: right;
        }

        /* --- 13. MERMAID & MATHJAX --- */
        .mermaid, .mermaid * {
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .mermaid {
            overflow-x: auto;
            max-width: 100%;
        }

        mjx-container[display="false"] {
            margin: 0.15rem 0.4rem;
            padding: 0.05rem 0;
            vertical-align: middle;
        }

        mjx-container[display="true"] {
            display: block;
            margin: 1.0rem 0;
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
        }

        /* --- 14. FULLSCREEN STATES --- */
        body.fullscreen-active header,
        body.fullscreen-active main .column:first-child {
            display: none;
        }
        body.fullscreen-active main .column:last-child {
            width: 100%;
            border-right: none;
        }

        body.editor-fullscreen-active header,
        body.editor-fullscreen-active main .column:last-child {
            display: none;
        }
        body.editor-fullscreen-active main .column:first-child {
            width: 100%;
            border-right: none;
        }

        /* --- 15. RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 48.0rem) {
            main {
                flex-direction: column;
            }

            .column {
                width: 100%;
                min-height: 25.0rem;
                border-right: none;
                border-bottom: 2px solid var(--border-color);
            }

            body.fullscreen-active main .column:last-child,
            body.editor-fullscreen-active main .column:first-child {
                height: 100%;
            }

            #latex-input, #latex-output {
                padding: 1.0rem;
            }
        }
    </style>
</head>

<body>

    <!-- Overlay kéo thả file toàn trang -->
    <div id="drag-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 153, 17, 0.15); backdrop-filter: blur(4px); z-index: 1000; border: 4px dashed var(--primary-color); align-items: center; justify-content: center; pointer-events: none; transition: all 0.2s;">
        <div
            style="background: #FFFFFF; padding: 1.0rem; border-radius: 0.8rem; text-align: center; border: 2px solid var(--border-color);">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor"
                style="width: 3.0rem; height: 3.0rem; color: var(--primary-color); margin-bottom: 0.5rem; display: inline-block;">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
            </svg>
            <h2 style="margin: 0; font-size: 1.2rem; color: var(--primary-color); font-weight: bold;">Thả file vào đây</h2>
            <p style="margin: 0.5rem 0 0 0; color: #1A1A1A; font-size: 1.0rem;">Hỗ trợ tập tin định dạng .md và .txt</p>
        </div>
    </div>

    <!-- Input chọn file ẩn -->
    <input type="file" id="file-selector" accept=".md,.txt,.MD,.TXT,text/plain,text/markdown" style="display: none;"
        onchange="handleFileSelect(event)">

    <!-- Header -->
    <header>
        <h1>Chép câu trả lời của Gemini/ChatGPT (Markdown/LaTeX/Mermaid) dùng cho Word / Docs</h1>
        <div class="author">Dương Tấn Chánh</div>
    </header>

    <!-- HỘP THOẠI 1: LỰA CHỌN ĐỊNH DẠNG SAO CHÉP -->
    <div id="copy-modal" class="modal-overlay" onclick="if (event.target === this) closeCopyModal();">
        <div class="modal-card">
            <h3
                style="margin: 0 0 1.0rem 0; font-size: 1.2rem; color: var(--primary-color); font-weight: bold; text-align: center;">
                Chọn định dạng sao chép</h3>
            <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                <button onclick="executeCopy('markdown')" class="btn modal-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                    </svg>
                    <span>1. Markdown</span>
                </button>
                <button onclick="openFontSelectorModal('gdocs')" class="btn modal-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    <span>2. Google Docs (Ảnh PNG)</span>
                </button>
                <button onclick="openFontSelectorModal('word')" class="btn modal-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                    </svg>
                    <span>3. MS Word (Công thức gốc)</span>
                </button>
            </div>
            <button onclick="closeCopyModal()" class="btn"
                style="width: 100%; margin-top: 1.0rem; background-color: #FFFFFF; border-color: var(--border-color); color: #1A1A1A;">Huỷ
                bỏ</button>
        </div>
    </div>

    <!-- HỘP THOẠI 2: LỰA CHỌN PHÔNG CHỮ CHO WORD / GOOGLE DOCS -->
    <div id="font-modal" class="modal-overlay" onclick="if (event.target === this) closeFontModal();">
        <div class="modal-card">
            <h3
                style="margin: 0 0 0.3rem 0; font-size: 1.2rem; color: var(--primary-color); font-weight: bold; text-align: center;">
                Chọn phông chữ tài liệu</h3>
            <p style="margin: 0 0 1.0rem 0; font-size: 0.95rem; color: #475569; text-align: center;" id="font-modal-subtitle">
                Áp dụng cho tài liệu xuất</p>
            <div style="display: flex; flex-direction: column; gap: 0.6rem;">
                <button onclick="selectFontAndExecute('Times New Roman')" class="btn modal-btn" style="font-family: 'Times New Roman', serif;">
                    <span style="font-weight: bold;">Times New Roman</span>
                </button>
                <button onclick="selectFontAndExecute('Arial')" class="btn modal-btn" style="font-family: Arial, sans-serif;">
                    <span style="font-weight: bold;">Arial</span>
                </button>
                <button onclick="selectFontAndExecute('Roboto')" class="btn modal-btn" style="font-family: Roboto, sans-serif;">
                    <span style="font-weight: bold;">Roboto</span>
                </button>
                <button onclick="selectFontAndExecute('Noto Sans')" class="btn modal-btn" style="font-family: 'Noto Sans', sans-serif;">
                    <span style="font-weight: bold;">Noto Sans</span>
                </button>
            </div>
            <button onclick="closeFontModal(); copyOutput();" class="btn"
                style="width: 100%; margin-top: 1.0rem; background-color: #FFFFFF; border-color: var(--border-color); color: #1A1A1A;">Quay
                lại</button>
        </div>
    </div>

    <!-- HỘP THOẠI 3: LỰA CHỌN PHƯƠNG THỨC TẢI VỀ -->
    <div id="download-modal" class="modal-overlay" onclick="if (event.target === this) closeDownloadModal();">
        <div class="modal-card">
            <h3

## Ví Dụ Trực Quan Về Toán Học

### Cách Dùng Cơ Bản

**Toán học trên cùng dòng (Inline)**: Phương trình nổi tiếng của Einstein $E = mc^2$ thể hiện sự tương đương khối lượng - năng lượng.

**Toán học dạng khối (Display)** - Định luật 2 Newton:

$$F = ma$$

### Các Trường Hợp Phổ Biến

#### 1. Giải Tích & Đạo Hàm

$$\\frac{d}{dx}(x^2) = 2x \\quad \\text{và} \\quad \\int x^2 dx = \\frac{x^3}{3} + C$$

#### 2. Phân Số

$$\\frac{a}{b} + \\frac{c}{d} = \\frac{ad + bc}{bd}$$

#### 3. Căn Thức

$$\\sqrt{16} = 4 \\quad \\text{và} \\quad \\sqrt[3]{27} = 3$$

#### 4. Ký Tự Hy Lạp

$$\\alpha + \\beta = \\gamma \\quad \\theta = 45^\\circ \\quad \\pi \\approx 3,14159$$

Ký tự thông dụng: $\\alpha$, $\\beta$, $\\gamma$, $\\delta$, $\\epsilon$, $\\theta$, $\\lambda$, $\\mu$, $\\pi$, $\\sigma$, $\\omega$

#### 5. Tổng & Tích Phép Số

$$\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2} \\quad \\prod_{i=1}^{n} i = n!$$

#### 6. Ma Trận Toán Học

$$\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix} \\begin{pmatrix} x \\\\ y \\end{pmatrix} = \\begin{pmatrix} ax + by \\\\ cx + dy \\end{pmatrix}$$

#### 7. Giới Hạn (Giới Hạn Hàm Số)

$$\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1$$

#### 8. Tích Phân Xác Định

$$\\int_0^{\\pi} \\sin x \\, dx = 2$$

#### 9. Thống Kê & Xác Suất

$$\\mu = \\frac{1}{n}\\sum_{i=1}^n x_i \\quad \\sigma^2 = \\frac{1}{n}\\sum_{i=1}^n (x_i - \\mu)^2$$

#### 10. Phương Trình Bậc Hai

$$x = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}$$

## Tính Năng Nâng Cao

### Hệ Phương Trình Căn Chỉnh (Aligned)

$$\\begin{align*} (x+y)^2 &= x^2 + 2xy + y^2 \\\\ (x-y)^2 &= x^2 - 2xy + y^2 \\\\ (x+y)(x-y) &= x^2 - y^2 \\end{align*}$$

### Hàm Số Cho Bởi Nhiều Công Thức

$$f(x) = \\begin{cases} x^2 & \\text{nếu } x \\geq 0 \\\\ -x^2 & \\text{nếu } x < 0 \\end{cases}$$

### Hệ Phương Trình Bậc Nhất

$$\\begin{cases} x + 2y = 5 \\\\ 3x - y = 4 \\end{cases}$$

### Lượng Giác

$$\\sin^2\\theta + \\cos^2\\theta = 1 \\quad \\tan\\theta = \\frac{\\sin\\theta}{\\cos\\theta}$$

## Lập Trình Và Toán Học

Kết hợp mã nguồn và công thức toán học dễ dàng. Xuất bản tài liệu sang **PDF** hoặc **Word** giữ nguyên định dạng công thức.

\`\`\`python
def quadratic_formula(a, b, c):
    """
    Giải phương trình: ax² + bx + c = 0
    Công thức: x = (-b ± √(b²-4ac)) / 2a
    """
    discriminant = b**2 - 4*a*c
    x1 = (-b + discriminant**0.5) / (2*a)
    x2 = (-b - discriminant**0.5) / (2*a)
    return x1, x2

# Ví dụ: x² - 5x + 6 = 0
print(quadratic_formula(1, -5, 6))  # Kết quả: (3.0, 2.0)

## Ví Dụ Thực Tế Khác

### Khoa Học Máy Tính (Độ Phức Tạp Đệ Quy)

$$T(n) = \\begin{cases} 1 & \\text{nếu } n = 1 \\\\ 2T(\\frac{n}{2}) + n & \\text{nếu } n > 1 \\end{cases}$$

Giải phương trình đệ quy: $T(n) = O(n \\log n)$

### Tài Chính Kinh Tế (Lãi Kép)

$$FV = PV \\times (1 + r)^n \\quad CI = P \\left(1 + \\frac{r}{n}\\right)^{nt} - P$$

### Xác Suất Đại Cương

$$P(A \\cup B) = P(A) + P(B) - P(A \\cap B)$$

$$E(X) = \\sum_{i=1}^n x_i \\cdot P(x_i)$$

                btnClearSample.style.borderColor = 'var(--danger-color)';
                btnClearSample.innerHTML = CONFIRM_ICON_SVG;

                clearTimeoutId = setTimeout(() => {
                    btnClearSample.dataset.confirm = "false";
                    updateActionBtnState();
                }, 3000);
            }
        }

        // --- BẢO VỆ CÔNG THỨC TOÁN ---
        function escapeMath(text) {
            const mathBlocks = [];
            const correctRegex = /\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\]|\$([^$\n]*?)\$|\\\(([\s\S]*?)\\\)/g;

            const protectedText = text.replace(correctRegex, (match, g1, g2, g3, g4) => {
                const content = g1 || g2 || g3 || g4;
                if (content && (content.includes('\n#') || content.trim().startsWith('#'))) {
                    return match;
                }

                if (g1) {
                    let trimmed = g1.trim();
                    if (!trimmed.startsWith('\\displaystyle')) trimmed = `\\displaystyle ${trimmed}`;
                    mathBlocks.push(`$$${trimmed}$$`);
                    return `\n\nMATHJAXBLOCKPLACEHOLDER${mathBlocks.length - 1}\n\n`;
                }

                if (g2) {
                    let trimmed = g2.trim();
                    if (!trimmed.startsWith('\\displaystyle')) trimmed = `\\displaystyle ${trimmed}`;
                    mathBlocks.push(`\\[${trimmed}\\]`);
                    return `\n\nMATHJAXBLOCKPLACEHOLDER${mathBlocks.length - 1}\n\n`;
                }

                if (g3) {
                    mathBlocks.push(`$${g3.trim()}$`);
                    return `MATHJAXBLOCKPLACEHOLDER${mathBlocks.length - 1}`;
                }

                if (g4) {
                    mathBlocks.push(`\\(${g4.trim()}\\)`);
                    return `MATHJAXBLOCKPLACEHOLDER${mathBlocks.length - 1}`;
                }

                return match;
            });
            return { protectedText, mathBlocks };
        }

        function escapeHtmlLite(text) {
            return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- BIÊN DỊCH VÀ HIỂN THỊ KẾT QUẢ ---
        function renderContent() {
            if (!input || !output) return;
            const rawText = input.value;

            const codeBlocks = [];
            const tempText = rawText.replace(/```[\s\S]*?```|`[^`\n]*?`/g, (match) => {
                codeBlocks.push(match);
                return `CODEBLOCKPLACEHOLDER${codeBlocks.length - 1}`;
            });

            const { protectedText, mathBlocks } = escapeMath(tempText);

            let restoredText = protectedText;
            for (let i = codeBlocks.length - 1; i >= 0; i--) {
                restoredText = restoredText.replace(`CODEBLOCKPLACEHOLDER${i}`, () => codeBlocks[i]);
            }

            let htmlContent = (typeof marked !== 'undefined' && typeof marked.parse === 'function') 
                ? marked.parse(restoredText) 
                : escapeHtmlLite(restoredText);

            for (let i = mathBlocks.length - 1; i >= 0; i--) {
                const safeBlock = escapeHtmlLite(mathBlocks[i]);
                htmlContent = htmlContent.replace(`MATHJAXBLOCKPLACEHOLDER${i}`, () => safeBlock);
            }

            // Nhận diện linh hoạt mọi định dạng class của Mermaid
            htmlContent = htmlContent.replace(/<pre><code class="(?:language-|lang-)?mermaid">([\s\S]*?)<\/code><\/pre>/gi, (match, codeText) => {
                const decoded = codeText.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                return `<div class="mermaid">${decoded}</div>`;
            });

            output.innerHTML = htmlContent;
            output.scrollLeft = 0;

            if (window.hljs) {
                try {
                    output.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                } catch (e) {
                    console.error("HighlightJS error", e);
                }
            }

            if (window.mermaid) {
                try {
                    mermaid.run({ nodes: output.querySelectorAll('.mermaid') });
                } catch (e) {
                    console.error("Mermaid error", e);
                }
            }

            if (window.MathJax && MathJax.typesetPromise) {
                promise = promise.then(() => {
                    return MathJax.typesetPromise([output]);
                }).catch((err) => {
                    console.error('MathJax Error:', err);
                    return Promise.resolve();
                });
            }
        }

        // --- LƯU NHÁP TỰ ĐỘNG ---

        async function executeCopy(format, chosenFont = 'Times New Roman') {

        // --- HÀM DÙNG CHUNG: CHUYỂN MERMAID SANG ẢNH PNG (ĐỌC KÍCH THƯỚC ĐA TẦNG AN TOÀN) ---
        async function convertMermaidToImages(container) {
            const mermaidContainers = container.querySelectorAll('.mermaid');
            const diagramPromises = Array.from(mermaidContainers).map(async (diagramContainer) => {
                const svgEl = diagramContainer.querySelector('svg');
                if (!svgEl) return;
                try {
                    let origWidth = 0, origHeight = 0;
                    
                    // 1. Ưu tiên đọc viewBox
                    const viewBox = svgEl.getAttribute('viewBox');
                    if (viewBox) {
                        const parts = viewBox.trim().split(/[\s,]+/).map(Number);
                        if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
                            origWidth = parts[2];
                            origHeight = parts[3];
                        }
                    }
                    
                    // 2. Dự phòng đọc thuộc tính width/height
                    if (!origWidth || !origHeight) {
                        const wAttr = parseFloat(svgEl.getAttribute('width'));
                        const hAttr = parseFloat(svgEl.getAttribute('height'));
                        if (!isNaN(wAttr) && !isNaN(hAttr) && wAttr > 0 && hAttr > 0) {
                            origWidth = wAttr;
                            origHeight = hAttr;
                        }
                    }
                    
                    // 3. Dự phòng đọc bounding box thực
                    if (!origWidth || !origHeight) {
                        const rect = svgEl.getBoundingClientRect();
                        if (rect.width > 0 && rect.height > 0) {
                            origWidth = Math.round(rect.width);
                            origHeight = Math.round(rect.height);
                        }
                    }
                    
                    // 4. Giá trị mặc định an toàn
                    if (!origWidth || !origHeight) {
                        origWidth = 400;
                        origHeight = 300;
                    }

                    const pngData = await svgToPngDataUrl(svgEl);
                    if (pngData) {
                        const imgTag = document.createElement('img');
                        imgTag.src = pngData;
                        imgTag.setAttribute('width', String(Math.round(origWidth)));
                        imgTag.setAttribute('height', String(Math.round(origHeight)));
                        imgTag.style.width = Math.round(origWidth) + 'px';
                        imgTag.style.height = Math.round(origHeight) + 'px';

                        const divWrapper = document.createElement('div');
                        divWrapper.style.textAlign = 'center';
                        divWrapper.style.margin = '16px 0';
                        divWrapper.appendChild(imgTag);
                        diagramContainer.replaceWith(divWrapper);
                    }
                } catch (e) {
                    console.error("Mermaid export error", e);
                }
            });
            await Promise.all(diagramPromises);
        }

        // --- ĐỒNG BỘ TOÀN BỘ ĐỊNH DẠNG & MÀU SẮC KHI XUẤT CHO WORD / GDOCS ---
        function formatForExport(container, chosenFont) {
            const fontFallback = chosenFont === 'Times New Roman' ? 'serif' : 'sans-serif';
            const fullFontFamily = `"${chosenFont}", ${fontFallback}`;

            // 1. Áp dụng phông chữ được chọn và đồng bộ màu sắc văn bản
            container.querySelectorAll('h1, h2').forEach(el => {
                el.style.fontFamily = fullFontFamily;
                el.style.color = APP_THEME.text;
                el.style.borderBottom = '2px solid ' + APP_THEME.divider;
                el.style.paddingBottom = '6px';
            });

            container.querySelectorAll('h3, h4, p, li').forEach(el => {
                el.style.fontFamily = fullFontFamily;
                el.style.color = APP_THEME.text;
            });

            container.querySelectorAll('a').forEach(el => {
                el.style.fontFamily = fullFontFamily;
                el.style.color = APP_THEME.link;
                el.style.textDecoration = 'underline';
            });

            container.querySelectorAll('blockquote').forEach(el => {
                el.style.fontFamily = fullFontFamily;
                el.style.borderLeft = '4px solid ' + APP_THEME.blockquoteBorder;
                el.style.backgroundColor = APP_THEME.blockquoteBg;
                el.style.color = APP_THEME.text;
                el.style.padding = '8px 12px';
                el.style.margin = '12px 0';
            });

            // 2. Đồng bộ màu cú pháp Code (Syntax Highlight)
            const hljsMap = {
                'hljs-keyword': APP_THEME.syntaxKeyword,
                'hljs-doctag': APP_THEME.syntaxKeyword,
                'hljs-template-tag': APP_THEME.syntaxKeyword,
                'hljs-template-variable': APP_THEME.syntaxKeyword,
                'hljs-type': APP_THEME.syntaxKeyword,
                'hljs-title': APP_THEME.syntaxFunction,
                'hljs-attr': APP_THEME.syntaxString,
                'hljs-attribute': APP_THEME.syntaxString,
                'hljs-literal': APP_THEME.syntaxString,
                'hljs-number': APP_THEME.syntaxString,
                'hljs-operator': APP_THEME.syntaxString,
                'hljs-variable': APP_THEME.syntaxString,
                'hljs-string': APP_THEME.syntaxString,
                'hljs-regexp': APP_THEME.syntaxString,
                'hljs-built_in': APP_THEME.syntaxBuiltin,
                'hljs-symbol': APP_THEME.syntaxBuiltin,
                'hljs-comment': APP_THEME.syntaxComment,
                'hljs-code': APP_THEME.syntaxComment,
                'hljs-formula': APP_THEME.syntaxComment,
                'hljs-name': APP_THEME.syntaxTag,
                'hljs-quote': APP_THEME.syntaxTag,
                'hljs-section': APP_THEME.syntaxString
            };

            container.querySelectorAll('[class^="hljs-"], [class*=" hljs-"]').forEach(span => {
                span.classList.forEach(cls => {
                    if (hljsMap[cls]) {
                        span.style.color = hljsMap[cls];
                        if (cls.includes('keyword') || cls.includes('title') || cls.includes('section')) {
                            span.style.fontWeight = 'bold';
                        }
                        if (cls.includes('comment') || cls.includes('formula')) {
                            span.style.fontStyle = 'italic';
                        }
                    }
                });
            });

            // 3. Đồng bộ Khối Code & Inline Code (CỠ CHỮ CODE = 1em BẰNG CHÍNH XÁC CỠ BODY)
            container.querySelectorAll('code').forEach(el => {
                el.style.fontFamily = "Consolas, 'Courier New', monospace";
                el.style.fontSize = "1em";
                el.style.color = APP_THEME.codeText;

                if (el.parentNode.tagName === 'PRE') {
                    const pre = el.parentNode;
                    pre.style.backgroundColor = APP_THEME.codeBg;
                    pre.style.border = '1px solid #cbd5e1';
                    pre.style.padding = '12px';
                    pre.style.fontFamily = "Consolas, 'Courier New', monospace";
                    pre.style.fontSize = "1em";
                    pre.style.whiteSpace = 'pre-wrap';
                    pre.style.marginBottom = '12px';
                    pre.style.borderLeft = '4px solid #cbd5e1';
                } else {
                    el.style.backgroundColor = APP_THEME.codeBg;
                    el.style.padding = '2px 4px';
                    el.style.border = '1px solid rgba(0,0,0,0.15)';
                }
            });

            // 4. Đồng bộ Bảng biểu (Viền 0.75pt, Căn bám từ trên xuống)
            container.querySelectorAll('table').forEach(table => {
                table.setAttribute('border', '1');
                table.setAttribute('cellspacing', '0');
                table.setAttribute('cellpadding', '6');
                table.style.borderCollapse = 'collapse';
                table.style.border = '0.75pt solid ' + APP_THEME.tableBorder;
                table.style.width = '100%';
                table.style.fontFamily = fullFontFamily;
            });

            container.querySelectorAll('th').forEach(th => {
                const align = th.getAttribute('align') || th.style.textAlign || 'left';
                th.style.border = '0.75pt solid ' + APP_THEME.tableBorder;
                th.style.padding = '6px 10px';
                th.style.fontWeight = 'bold';
                th.style.backgroundColor = APP_THEME.tableThBg;
                th.style.color = APP_THEME.text;
                th.style.fontFamily = fullFontFamily;
                th.style.textAlign = align;
                th.style.verticalAlign = 'top';
                th.setAttribute('align', align);
            });

            container.querySelectorAll('td').forEach(td => {
                const align = td.getAttribute('align') || td.style.textAlign || 'left';
                td.style.border = '0.75pt solid ' + APP_THEME.tableBorder;
                td.style.padding = '6px 10px';
                td.style.color = APP_THEME.text;
                td.style.fontFamily = fullFontFamily;
                td.style.textAlign = align;
                td.style.verticalAlign = 'top';
                td.setAttribute('align', align);
            });
        }

        // --- 2. CHÉP DẠNG GOOGLE DOCS (GIẢI THUẬT GỐC CHUẨN XÁC 100%) ---
        async function copyGoogleDocs(chosenFont) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = output.innerHTML;
            tempDiv.classList.add('markdown-body');
            tempDiv.style.fontFamily = `"${chosenFont}", sans-serif`;
            document.body.appendChild(tempDiv);

            try {
                if (window.MathJax && MathJax.typesetPromise) {
                    await MathJax.typesetPromise([tempDiv]);
                }

                // 1. Chuyển đổi sơ đồ Mermaid sang ảnh PNG 2x độ nét cao
                await convertMermaidToImages(tempDiv);

                // 2. Chuyển đổi công thức Toán học MathJax sang ảnh PNG 2x
                const containers = Array.from(tempDiv.querySelectorAll('mjx-container'));

                const conversionPromises = containers.map(async (container) => {
                    const svgEl = container.querySelector('svg');
                    if (!svgEl) return;
                    try {
                        const pngData = await svgToPngDataUrl(svgEl);
                        if (pngData) {
                            const imgTag = document.createElement('img');
                            imgTag.src = pngData;

                            const rect = svgEl.getBoundingClientRect();
                            const displayWidth = Math.ceil(rect.width);
                            const displayHeight = Math.ceil(rect.height);

                            imgTag.setAttribute('width', String(displayWidth));
                            imgTag.setAttribute('height', String(displayHeight));
                            imgTag.style.width = displayWidth + 'px';
                            imgTag.style.height = displayHeight + 'px';
                            imgTag.style.verticalAlign = '-0.5ex';

                            const isDisplay = container.getAttribute('display') === 'true';
                            if (isDisplay) {
                                const divWrapper = document.createElement('div');
                                divWrapper.style.textAlign = 'center';
                                divWrapper.style.margin = '12px 0';
                                divWrapper.appendChild(imgTag);
                                container.replaceWith(divWrapper);
                            } else {
                                container.innerHTML = '';
                                container.appendChild(document.createTextNode('\u00A0'));
                                container.appendChild(imgTag);
                                container.appendChild(document.createTextNode('\u00A0'));
                            }
                        }
                    } catch (e) {
                        console.error("Skip error SVG", e);
                    }
                });
                await Promise.all(conversionPromises);

                // 3. Đồng bộ toàn bộ màu sắc, phông chữ & cỡ code = 1em
                formatForExport(tempDiv, chosenFont);

                // 4. Chuẩn hóa MIME type tuyệt đối cho Clipboard API
                const blobHtml = new Blob([tempDiv.innerHTML], { type: 'text/html' });
                const blobText = new Blob([tempDiv.innerText || tempDiv.textContent], { type: 'text/plain' });
                await navigator.clipboard.write([new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })]);
            } finally {
                if (tempDiv.parentNode) {
                    tempDiv.parentNode.removeChild(tempDiv);
                }
            }
        }

        // --- DỌN RÁC THUỘC TÍNH MATHML CHO MS WORD ---
        const ALLOWED_MATHML_ATTRS = new Set([
            'xmlns', 'display', 'width', 'height', 'depth', 'align',
            'rowalign', 'columnalign', 'fence', 'form', 'separator',
            'stretchy', 'symmetric', 'largeop', 'movablelimits', 'accent'
        ]);

        function cleanMathMLForWord(element) {
            if (!element || element.nodeType !== 1) return;
            Array.from(element.attributes).forEach(attr => {
                if (!ALLOWED_MATHML_ATTRS.has(attr.name.toLowerCase())) {
                    element.removeAttribute(attr.name);
                }
            });
            Array.from(element.children).forEach(cleanMathMLForWord);
        }

        // --- 3. CHÉP DẠNG MS WORD (GIẢI THUẬT GỐC CHUẨN XÁC 100% CÓ DỰ PHÒNG PNG) ---
        async function copyWord(chosenFont) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = output.innerHTML;
            tempDiv.classList.add('markdown-body');
            tempDiv.style.fontFamily = `"${chosenFont}", serif`;
            document.body.appendChild(tempDiv);

            try {
                if (window.MathJax && MathJax.typesetPromise) {
                    await MathJax.typesetPromise([tempDiv]);
                }

                // 1. Chuyển đổi sơ đồ Mermaid sang ảnh PNG 2x độ nét cao cho Word
                await convertMermaidToImages(tempDiv);

                // 2. Chuyển đổi MathJax sang MathML gốc không dính chữ (Kèm dự phòng PNG nếu lỗi)
                const containers = Array.from(tempDiv.querySelectorAll('mjx-container'));
                const mathPromises = containers.map(async (container) => {
                    const mathEl = container.querySelector('mjx-assistive-mml math');
                    if (mathEl) {
                        const clonedMath = mathEl.cloneNode(true);
                        clonedMath.setAttribute('xmlns', 'http://www.w3.org/1998/Math/MathML');
                        cleanMathMLForWord(clonedMath);

                        clonedMath.querySelectorAll('mspace').forEach(mspace => {
                            if (mspace.hasAttribute('linebreak')) return;
                            const widthAttr = mspace.getAttribute('width') || '';
                            let spaceText = '\u00A0\u00A0';
                            if (widthAttr.includes('em')) {
                                const emValue = parseFloat(widthAttr) || 0;
                                if (emValue >= 2) spaceText = '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0';
                                else if (emValue >= 1) spaceText = '\u00A0\u00A0\u00A0\u00A0';
                            }
                            const mtext = document.createElementNS('http://www.w3.org/1998/Math/MathML', 'mtext');
                            mtext.textContent = spaceText;
                            mspace.replaceWith(mtext);
                        });

                        clonedMath.querySelectorAll('mtext').forEach(mtext => {
                            if (mtext.textContent) {
                                mtext.textContent = mtext.textContent.replace(/^\s+/g, '\u00A0').replace(/\s+$/, '\u00A0');
                            }
                        });

                        if (container.getAttribute('display') === 'true') {
                            clonedMath.setAttribute('display', 'block');
                            const divWrapper = document.createElement('div');
                            divWrapper.style.textAlign = 'center';
                            divWrapper.style.margin = '12px 0';
                            divWrapper.appendChild(clonedMath);
                            container.replaceWith(divWrapper);
                        } else {
                            clonedMath.setAttribute('display', 'inline');
                            container.replaceWith(document.createTextNode('\u00A0'), clonedMath, document.createTextNode('\u00A0'));
                        }
                    } else {
                        // DỰ PHÒNG: Nếu MathML không tồn tại, tự động chuyển sang ảnh PNG cho Word
                        const svgEl = container.querySelector('svg');
                        if (svgEl) {
                            try {
                                const pngData = await svgToPngDataUrl(svgEl);
                                if (pngData) {
                                    const imgTag = document.createElement('img');
                                    imgTag.src = pngData;
                                    const rect = svgEl.getBoundingClientRect();
                                    imgTag.setAttribute('width', String(Math.ceil(rect.width)));
                                    imgTag.setAttribute('height', String(Math.ceil(rect.height)));
                                    imgTag.style.width = Math.ceil(rect.width) + 'px';
                                    imgTag.style.height = Math.ceil(rect.height) + 'px';
                                    imgTag.style.verticalAlign = '-0.5ex';
                                    container.replaceWith(document.createTextNode('\u00A0'), imgTag, document.createTextNode('\u00A0'));
                                }
                            } catch (err) {
                                console.error("Math fallback error", err);
                            }
                        }
                    }
                });
                await Promise.all(mathPromises);

                // 3. Đồng bộ toàn bộ màu sắc, phông chữ & cỡ code = 1em
                formatForExport(tempDiv, chosenFont);

                // 4. Chuẩn hóa MIME type tuyệt đối cho Clipboard API
                const blobHtml = new Blob([tempDiv.innerHTML], { type: 'text/html' });
                const blobText = new Blob([tempDiv.innerText || tempDiv.textContent], { type: 'text/plain' });
                await navigator.clipboard.write([new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })]);
            } finally {
                if (tempDiv.parentNode) {
                    tempDiv.parentNode.removeChild(tempDiv);
                }
            }
        }

        // --- XUẤT TẬP TIN ---
        function executeDownload(type) {
            closeDownloadModal();
            if (type === 'md') downloadMd();
            else if (type === 'html') saveHtml();
        }

        function getTimestampFilename(ext) {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${ext === 'html' ? 'Ket_Qua' : 'Bai_Viet'}_${y}-${m}-${d}_${h}-${min}-${s}.${ext}`;
        }

        function saveHtml() {
            const cleanContent = output.innerHTML.replace(/<mjx-assistive-mml[\s\S]*?<\/mjx-assistive-mml>/gi, '');
            const styleTags = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');

            const html = `<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết quả xuất HTML - Dương Tấn Chánh</title>
${styleTags}
<style>
    body { padding: 1.0rem; background-color: #FFFFFF; font-size: 1.0rem; }
    mjx-container[display='true'] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
</style>
</head>
<body>
<div class="markdown-body">
${cleanContent}
</div>
</body>
</html>`;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = getTimestampFilename('html');
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadMd() {
            const blob = new Blob([input.value], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = getTimestampFilename('md');
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- PHÓNG TO / THU NHỎ KHUNG ---
        function toggleFullscreen() {
            const bodyEl = document.body;
            const btn = document.getElementById('btn-fullscreen');
            const icon = document.getElementById('fullscreen-icon');

            if (bodyEl.classList.contains('editor-fullscreen-active')) {
                toggleEditorFullscreen();
            }

            const isFullscreen = bodyEl.classList.toggle('fullscreen-active');
            btn.title = isFullscreen ? 'Thu nhỏ kết quả' : 'Phóng to kết quả';
            icon.innerHTML = isFullscreen
                ? '<path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9V4.5M15 9h4.5M15 9l5.25-5.25M15 15v4.5M15 15h4.5M15 15l5.25 5.25" />'
                : '<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />';

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([output]);
            }
        }

        function toggleEditorFullscreen() {
            const bodyEl = document.body;
            const btn = document.getElementById('btn-editor-fullscreen');
            const icon = document.getElementById('editor-fullscreen-icon');

            if (bodyEl.classList.contains('fullscreen-active')) {
                toggleFullscreen();
            }

            const isFullscreen = bodyEl.classList.toggle('editor-fullscreen-active');
            btn.title = isFullscreen ? 'Thu nhỏ khung soạn thảo' : 'Phóng to khung soạn thảo';
            icon.innerHTML = isFullscreen
                ? '<path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9V4.5M15 9h4.5M15 9l5.25-5.25M15 15v4.5M15 15h4.5M15 15l5.25 5.25" />'
                : '<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />';
        }

        // --- CHUYỂN SVG SANG PNG KHÔNG RÒ RỈ BỘ NHỚ ---
        async function svgToPngDataUrl(svgElement) {
            return new Promise((resolve, reject) => {
                let url = null;
                try {
                    const rect = svgElement.getBoundingClientRect();
                    const scaleFactor = 2;

                    if (rect.width === 0 || rect.height === 0) { resolve(null); return; }

                    const width = Math.ceil(rect.width * scaleFactor);
                    const height = Math.ceil(rect.height * scaleFactor);

                    const clonedSvg = svgElement.cloneNode(true);
                    const computedStyle = window.getComputedStyle(svgElement);
                    clonedSvg.style.cssText = `
                        font-family: ${computedStyle.fontFamily};
                        font-size: ${computedStyle.fontSize};
                        font-weight: ${computedStyle.fontWeight};
                        color: ${computedStyle.color};
                        width: ${width}px;
                        height: ${height}px;
                    `;

                    clonedSvg.setAttribute("width", width + "px");
                    clonedSvg.setAttribute("height", height + "px");

                    if (!clonedSvg.getAttribute('xmlns')) clonedSvg.setAttribute('xmlns', "http://www.w3.org/2000/svg");
                    if (!clonedSvg.getAttribute('xmlns:xlink')) clonedSvg.setAttribute('xmlns:xlink', "http://www.w3.org/1999/xlink");

                    const svgData = new XMLSerializer().serializeToString(clonedSvg);
                    const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
                    url = URL.createObjectURL(blob);

                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.clearRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);

                        if (url) URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL("image/png"));
                    };
                    img.onerror = function (e) {
                        if (url) URL.revokeObjectURL(url);
                        reject(new Error("Image SVG failed to render"));
                    };
                    img.src = url;
                } catch (e) {
                    if (url) URL.revokeObjectURL(url);
                    reject(e);
                }
            });
        }

        // --- KÉO THẢ TẬP TIN TOÀN TRANG CHỐNG NHẤP NHÁY ---
        const dragOverlay = document.getElementById('drag-overlay');
        let dragCounter = 0;

        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            if (e.dataTransfer.types.includes('Files')) {
                dragCounter++;
                dragOverlay.style.display = 'flex';
            }
        });

        window.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        window.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                dragOverlay.style.display = 'none';
            }
        });

        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dragOverlay.style.display = 'none';
            if (e.dataTransfer.files.length > 0) {
                handleFileImport(e.dataTransfer.files[0]);
            }
        });

        function handleFileSelect(event) {
            if (event.target.files.length > 0) {
                handleFileImport(event.target.files[0]);
            }
            event.target.value = '';
        }

        function handleFileImport(file) {
            try {
                const reader = new FileReader();
                reader.onload = function (e) {
                    input.value = e.target.result;
                    renderContent();
                    localStorage.setItem('latex_input_v3', input.value);
                    updateActionBtnState();
                    input.scrollTop = 0;
                    output.scrollTop = 0;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                reader.onerror = function () {
                    alert("Không thể đọc tập tin này! Vui lòng kiểm tra lại định dạng.");
                };
                reader.readAsText(file, 'UTF-8');
            } catch (err) {
                console.error("Lỗi khi mở tập tin:", err);
                alert("Đã xảy ra lỗi khi nạp tập tin.");
            }
        }
    </script>
